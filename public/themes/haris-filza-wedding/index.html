<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Invitation</title>
<meta name="description" content="You're invited to the Nikah & Wedding of Haris & Filza">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Wedding Invitation">
<meta property="og:description" content="You're invited to the Nikah & Wedding of Haris & Filza">
<meta property="og:image" content="/themes/haris-filza-wedding/og.jpg">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#efe6d6">
<link rel="preload" as="image" href="assets/door-l.jpg">
<link rel="preload" as="image" href="assets/door-r.jpg">
<link rel="preload" as="image" href="assets/bow.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Marcellus&family=Great+Vibes&display=swap">
<style>
/* =========================================================
   HARIS & FILZA · private card, built from Lulua.
   Not listed in the shop and not available to try. Lulua itself is
   untouched: this folder has its own copy of every file it uses.
   English only (the Qur'anic verses stay in Arabic), an order of
   events, and RSVP on WhatsApp.
   ========================================================= */
:root{
  --paper:#f3ece0; --paper-2:#efe6d6; --ink:#4b3b29; --ink-2:#6a5640; --muted:#8c7a62;
  --gold:#a8823f; --gold-2:#c9a463; --gold-d:#7d5f2b; --line:rgba(168,130,63,.38);
  --f-verse:"Noto Nastaliq Urdu","Amiri",serif;                       /* Qur'anic verses, both languages */
  --f-body:"Marcellus","Amiri",Georgia,serif;
  --f-script:"Great Vibes","Noto Nastaliq Urdu",cursive;               /* names and occasion titles */
  --sw:390px; --sh:844px; --fu:390px;      /* stage size, set by script */
  color-scheme:light;
}
html[lang=ar]{--f-body:"Tajawal","Amiri",sans-serif; --f-script:"Noto Nastaliq Urdu","Amiri",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper-2);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-40px;background:url(assets/frame-top.webp) center/cover;filter:blur(28px) saturate(.9);opacity:.55}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- the stage: a phone-shaped column, full screen on phones ---------- */
#stage{position:fixed;top:0;bottom:0;left:50%;width:var(--sw);height:var(--sh);transform:translateX(-50%);overflow:hidden;overflow:clip;background:var(--paper);box-shadow:0 0 60px rgba(90,64,30,.25);isolation:isolate}

/* the frame is three slices so it fits any screen height: top and bottom keep their shape, the plain pillar section stretches.
   It is drawn wider than the screen, so the pillars sit half off the edges and the card inside has room to breathe. */
:root{--fk:1.28;--ft:39px}   /* --ft: how much of the bow is tucked above the screen, set by script so the slices never overlap */
.fr{position:absolute;inset:0;pointer-events:none;overflow:hidden;overflow:clip}
.fr i{position:absolute;left:calc(var(--sw) * (1 - var(--fk)) / 2);width:calc(var(--sw) * var(--fk));background-repeat:no-repeat;background-size:100% 100%}
.fr .t{top:calc(var(--ft) * -1);height:calc(var(--sw) * var(--fk) * .8889)}
.fr .b{bottom:calc(var(--sw) * -.03);height:calc(var(--sw) * var(--fk) * .6111)}
.fr .m{top:calc(var(--sw) * var(--fk) * .8889 - var(--ft) - 1px);bottom:calc(var(--sw) * (var(--fk) * .6111 - .03) - 1px)}
.fr.bg{z-index:0}
.fr.bg .t{background-image:url(assets/frame-top.webp)} .fr.bg .m{background-image:url(assets/frame-mid.webp)} .fr.bg .b{background-image:url(assets/frame-bot.webp)}
.fr.ov{z-index:3}
.fr.ov .t{background-image:url(assets/frame-over-top.webp)} .fr.ov .m{background-image:url(assets/frame-over-mid.webp)} .fr.ov .b{background-image:url(assets/frame-over-bot.webp)}

/* ---------- the scrolling invitation ---------- */
#scroll{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-snap-type:y proximity;scrollbar-width:none;transition:opacity .3s;
  -webkit-mask-image:linear-gradient(to bottom,transparent calc(var(--sw) * .40 - var(--ft)),#000 calc(var(--sw) * .55 - var(--ft)),#000 calc(100% - var(--sw) * .09),transparent calc(100% - var(--sw) * .01));
          mask-image:linear-gradient(to bottom,transparent calc(var(--sw) * .40 - var(--ft)),#000 calc(var(--sw) * .55 - var(--ft)),#000 calc(100% - var(--sw) * .09),transparent calc(100% - var(--sw) * .01))}
#scroll::-webkit-scrollbar{display:none}
#scroll.swap{opacity:0}
body.locked #scroll{overflow:hidden}
.sec{min-height:var(--sh);scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--sw) * .57 - var(--ft)) calc(var(--sw) * .155) calc(var(--sw) * .24)}
.sec > *{max-width:100%}
.sec p{margin:0}

/* reveal: each piece floats up out of a soft blur when its section arrives */
.rv{opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1.1s ease;transition-delay:var(--d,0s)}
.on .rv{opacity:1;transform:none;filter:none}
.instant .rv{transition:none!important}

.gold{background:linear-gradient(100deg,#7d5f2b 0%,#b68f4a 28%,#e2c487 48%,#a8823f 66%,#7d5f2b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:0 .25em}
.verse{font-family:var(--f-verse);font-weight:500;color:var(--ink);direction:rtl;line-height:2.25}
.script{font-family:var(--f-script);font-weight:400;line-height:1.25}
html[lang=ar] .script{font-weight:700;line-height:2.1}
.caps{text-transform:uppercase;letter-spacing:.08em}
html[lang=ar] .caps{letter-spacing:0}
.orn{width:calc(var(--fu) * .36);height:auto;color:var(--gold);margin:6px auto}

/* 1. couple and verse */
.s-hero{justify-content:flex-start;padding-bottom:0}
.s-hero .verse{font-size:calc(var(--fu) * .085);margin:0}
.callig{display:block;width:100%;max-width:calc(var(--fu) * .84);height:auto;margin:4px auto 8px;pointer-events:none;user-select:none}
.s-hero .tr{font-size:calc(var(--fu) * .04);color:var(--ink-2);margin-top:2px}
.ref{font-size:calc(var(--fu) * .034);color:var(--muted);margin-top:2px}
.couple{display:block;height:calc(var(--sh) * .52);max-height:calc(var(--sw) * 1.15);width:auto;max-width:none;margin:auto calc(var(--sw) * -.12) 0;pointer-events:none;user-select:none}
.on .couple.rv{transition-duration:1.8s}

/* 2. invitation card */
.bism{font-family:var(--f-verse);font-size:calc(var(--fu) * .05);color:var(--gold-d);direction:rtl;line-height:2.1}
.guestline{font-size:calc(var(--fu) * .036);color:var(--ink-2)}
.guestline b{color:var(--gold-d);font-weight:400}
html[lang=ar] .guestline b{font-weight:700}
.hosts{display:grid;gap:4px;margin:4px 0}
.hosts b{display:block;font-weight:400;font-size:calc(var(--fu) * .038);color:var(--ink);line-height:1.35}
html[lang=ar] .hosts b{font-weight:700}
.hosts span{display:block;font-size:calc(var(--fu) * .03);color:var(--muted);line-height:1.3}
.req{font-size:calc(var(--fu) * .036);line-height:1.55;margin-top:4px!important}
.names{display:grid;justify-items:center;margin:2px 0}
.names .nm{font-size:calc(var(--fu) * .135);white-space:nowrap}
html[lang=ar] .names .nm{font-size:calc(var(--fu) * .1)}
.rings{width:calc(var(--fu) * .1);height:auto;color:var(--gold);margin:-4px 0}
.when{font-size:calc(var(--fu) * .037);color:var(--ink-2);line-height:1.55}
.when small{display:block;font-size:.82em;color:var(--muted)}
.seats{display:inline-block;margin-top:8px;padding:3px 14px;border:1px solid var(--line);border-radius:99px;font-size:calc(var(--fu) * .033);color:var(--ink-2);background:rgba(255,252,246,.5)}

/* 3. events */
.insha{font-size:calc(var(--fu) * .072);margin:0}
.evt{font-size:calc(var(--fu) * .115);margin:0}
html[lang=ar] .evt{font-size:calc(var(--fu) * .085)}
.evsub{font-size:calc(var(--fu) * .035);color:var(--muted);margin-bottom:4px!important}
.rows{display:grid;gap:7px;width:100%;margin:6px 0 4px}
.row{display:grid;justify-items:center;font-size:calc(var(--fu) * .037);line-height:1.45}
.row svg{width:calc(var(--fu) * .062);height:calc(var(--fu) * .062);color:var(--gold);margin-bottom:3px}
.row b{font-weight:400;color:var(--ink)}
html[lang=ar] .row b{font-weight:700}
.row span{color:var(--ink-2)}
.row small{display:block;font-size:.85em;color:var(--muted)}
.evnote{font-size:calc(var(--fu) * .034);color:var(--muted);margin-top:4px!important}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;border:1px solid var(--gold);background:rgba(255,252,246,.6);color:var(--gold-d);text-decoration:none;font-size:calc(var(--fu) * .035);cursor:pointer;line-height:1.5}
.btn svg{width:1.1em;height:1.1em}
.btn.solid{background:linear-gradient(180deg,#c9a463,#a8823f);color:#fffaf0;border-color:#a8823f;box-shadow:0 4px 12px rgba(125,95,43,.25)}

/* 4. countdown */
.h2{font-size:calc(var(--fu) * .12);margin:0}
html[lang=ar] .h2{font-size:calc(var(--fu) * .08)}
.kick{font-size:calc(var(--fu) * .036);color:var(--muted)}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin:12px 0 6px}
.clock div{border:1px solid var(--line);border-radius:12px;background:rgba(255,252,246,.65);padding:6px 0 2px}
.clock b{display:block;font-size:calc(var(--fu) * .068);line-height:1.2;color:var(--gold-d);font-weight:400}
.clock span{font-size:calc(var(--fu) * .029);color:var(--muted)}

/* 5. notes */
.notes{display:grid;gap:12px;width:100%;margin-top:8px}
.note{display:grid;justify-items:center}
.note svg{width:calc(var(--fu) * .07);height:calc(var(--fu) * .07);color:var(--gold)}
.note b{font-size:calc(var(--fu) * .044);font-weight:400;color:var(--gold-d)}
html[lang=ar] .note b{font-weight:700}
.note span{font-size:calc(var(--fu) * .035);color:var(--ink-2);line-height:1.5}

/* 6. RSVP */
.form{display:grid;gap:9px;width:100%;margin-top:8px;text-align:start}
.f{display:grid;gap:2px;border:0;padding:0;margin:0;min-width:0}
.f label,.f legend{font-size:calc(var(--fu) * .034);color:var(--ink-2);padding:0}
.f input,.f select,.f textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,252,246,.8);border:1px solid var(--line);border-radius:10px;padding:5px 10px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.f textarea{min-height:56px;resize:none}
.choice{display:grid;gap:5px}
.choice label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:3px 10px;background:rgba(255,252,246,.6);cursor:pointer;font-size:calc(var(--fu) * .036);color:var(--ink)}
.choice input{accent-color:var(--gold);width:auto;margin:0}
.msg{font-size:14px;color:#9b3b2b;text-align:center}
.form .btn{justify-self:center;font-size:calc(var(--fu) * .039);padding:6px 22px}
.thanks{display:grid;gap:4px;justify-items:center}
.thanks .t{font-size:calc(var(--fu) * .12)}
html[lang=ar] .thanks .t{font-size:calc(var(--fu) * .08)}
.thanks p{font-size:calc(var(--fu) * .04)}
.thanks small{color:var(--muted);font-size:13px}

/* 7. closing */
.s-close{justify-content:flex-start;padding-bottom:0}
.s-close .verse{font-size:calc(var(--fu) * .058);line-height:2.3}
.s-close .tr{font-size:calc(var(--fu) * .036);color:var(--ink-2);line-height:1.45;margin-top:2px}
.regards{font-size:calc(var(--fu) * .046);color:var(--ink);margin-top:10px!important}
html[lang=ar] .regards{font-family:var(--f-script);font-weight:700;font-size:calc(var(--fu) * .065);line-height:2;margin-top:4px!important}
.from{font-size:calc(var(--fu) * .04);color:var(--ink-2);line-height:1.45;white-space:pre-line;margin-top:2px!important}
.tag{margin-top:6px;font-size:calc(var(--fu) * .034);color:var(--gold-d)}
.s-close .couple{height:calc(var(--sh) * .36)}
.credit{display:block;margin-top:2px;font-family:"Marcellus",serif;font-size:10px;letter-spacing:.3em;color:var(--muted);direction:ltr}

/* scroll cue */
#cue{position:absolute;z-index:4;left:50%;bottom:calc(var(--sw) * .03);transform:translateX(-50%);display:grid;justify-items:center;font-size:12px;color:var(--gold-d);pointer-events:none;transition:opacity .6s;opacity:0;white-space:nowrap}
#cue.show{opacity:1}
#cue svg{width:22px;height:22px;animation:bob 1.8s ease-in-out infinite}
#cue span{background:rgba(255,252,246,.75);padding:0 10px;border-radius:99px}
@keyframes bob{50%{transform:translateY(5px)}}

/* ---------- the gate ---------- */
#gate{position:absolute;inset:0;z-index:10;perspective:1400px;overflow:hidden;cursor:pointer}
.door{position:absolute;top:0;bottom:0;width:50.4%;background-size:cover;background-repeat:no-repeat;transition:transform 2.3s cubic-bezier(.65,0,.25,1),filter 2.3s;will-change:transform}
.door.l{left:0;background-image:url(assets/door-l.jpg);background-position:right center;transform-origin:left center;box-shadow:inset -2px 0 4px rgba(90,64,30,.25)}
.door.r{right:0;background-image:url(assets/door-r.jpg);background-position:left center;transform-origin:right center;box-shadow:inset 2px 0 4px rgba(90,64,30,.25)}
.beam{position:absolute;top:0;bottom:0;left:50%;width:6px;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,#fff 15%,#fff 85%,transparent);box-shadow:0 0 34px 14px rgba(255,250,238,1),0 0 110px 44px rgba(255,226,186,.75);opacity:0;transition:opacity .5s .3s}
.bow{position:absolute;left:50%;top:50%;width:calc(var(--sw) * .66);transform:translate(-50%,-25.5%);transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .8s;filter:drop-shadow(0 10px 14px rgba(90,64,30,.28));animation:sway 4.5s ease-in-out infinite;transform-origin:50% 25%}
.bow img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
@keyframes sway{50%{rotate:1.4deg}}
.gfor{position:absolute;left:50%;top:calc(var(--sh) * .085);transform:translateX(-50%);width:max-content;max-width:78%;text-align:center;background:rgba(255,252,246,.86);border:1px solid var(--line);border-radius:16px;padding:4px 18px 6px;box-shadow:0 6px 18px rgba(90,64,30,.12);transition:opacity .6s}
.gfor small{display:block;font-size:12px;color:var(--muted);line-height:1.5;letter-spacing:.08em}
.gfor b{font-family:var(--f-script);font-weight:400;font-size:26px;color:var(--gold-d);line-height:1.4}
html[lang=ar] .gfor b{font-weight:700;font-size:20px;line-height:2}
.tap{position:absolute;left:50%;bottom:calc(var(--sh) * .09);transform:translateX(-50%);white-space:nowrap;background:rgba(255,252,246,.88);border:1px solid var(--line);border-radius:99px;padding:4px 20px;font-size:14px;color:var(--gold-d);box-shadow:0 6px 18px rgba(90,64,30,.12);animation:pulse 2.2s ease-in-out infinite;transition:opacity .5s}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(201,164,99,.18),0 6px 18px rgba(90,64,30,.12)}}
#gate.open{cursor:default}
#gate.open .bow{animation:none;transform:translate(-50%,-25.5%) scale(.6);opacity:0}
#gate.open .tap,#gate.open .gfor{opacity:0}
#gate.open .beam{opacity:1}
#gate.open .door{filter:brightness(.95)}
#gate.part .beam{opacity:0;transition:opacity 1.2s .9s}
#gate.part .door.l{transform:translateX(-62%) rotateY(28deg);filter:brightness(1.06)}
#gate.part .door.r{transform:translateX(62%) rotateY(-28deg);filter:brightness(1.06)}
#gate.part{pointer-events:none}
#gate.gone{display:none}
.haze{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(60% 45% at 50% 48%,rgba(255,253,248,.98),rgba(250,226,222,.75) 55%,rgba(243,236,224,0) 100%)}
.haze.go{animation:haze 3.4s ease-out forwards}
@keyframes haze{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#scroll.intro{transform:scale(1.06);transition:transform 2.6s cubic-bezier(.2,.7,.2,1),opacity .3s}
#scroll.intro.in{transform:none}

/* ---------- floating music button ---------- */
#music{position:absolute;z-index:12;top:calc(var(--sw) * .035);left:calc(var(--sw) * .035);width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:rgba(255,252,246,.88);color:var(--gold-d);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 12px rgba(90,64,30,.15)}
#music svg{width:20px;height:20px}
#music .off,#music.muted .on{display:none}
#music.muted .off{display:block}
#sparks{position:fixed;inset:0;z-index:20;pointer-events:none;width:100vw;height:100vh}
.bless{position:fixed;z-index:21;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--f-script);font-size:34px;white-space:nowrap;color:var(--gold-d);text-shadow:0 0 12px rgba(255,252,246,.95),0 0 3px #fff;animation:bless 2s ease-out forwards}
html[lang=ar] .bless{font-weight:700;font-size:24px;line-height:2}
@keyframes bless{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.previewbar{position:fixed;z-index:30;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(40,30,18,.92);color:#f6eedf;padding:6px 6px 6px 16px;border-radius:99px;font-family:"Marcellus",serif;font-size:12px;letter-spacing:.2em;direction:ltr;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.previewbar .btn{font-family:system-ui,sans-serif;letter-spacing:0;font-size:13px;padding:6px 14px;white-space:nowrap}
body.is-preview #cue{bottom:calc(var(--sw) * .03 + 52px)}

/* names with their parents */
.names .par{display:block;font-size:calc(var(--fu) * .033);color:var(--muted);line-height:1.3;margin:-2px 0 2px;letter-spacing:.02em}

/* order of events: medallions on a gold thread that draws itself down the page */
.sched{position:relative;display:grid;gap:calc(var(--fu) * .026);width:100%;margin-top:12px;text-align:start}
.sched::before{content:"";position:absolute;left:calc(var(--fu) * .052);top:10px;bottom:10px;width:1px;background:linear-gradient(to bottom,rgba(201,164,99,0),var(--gold-2) 8%,var(--gold) 50%,var(--gold-2) 92%,rgba(201,164,99,0));transform:scaleY(0);transform-origin:top;transition:transform 2.4s cubic-bezier(.2,.7,.2,1) .25s}
.on .sched::before{transform:none}
.st{display:grid;grid-template-columns:calc(var(--fu) * .104) 1fr;gap:12px;align-items:center}
.st > i{position:relative;z-index:1;width:calc(var(--fu) * .104);height:calc(var(--fu) * .104);border-radius:50%;display:grid;place-items:center;color:var(--gold-d);
  background:radial-gradient(circle at 35% 30%,#fffdf8,#f0e5d2);border:1px solid var(--line);box-shadow:0 3px 10px rgba(125,95,43,.16),inset 0 0 0 3px rgba(255,252,246,.85)}
.st > i svg{width:52%;height:52%}
.st > div{display:grid;justify-items:start;line-height:1.25}
.st time{font-size:calc(var(--fu) * .028);letter-spacing:.07em;color:#fffaf0;background:linear-gradient(180deg,#c9a463,#a8823f);border-radius:99px;padding:1px 9px;margin-bottom:3px;box-shadow:0 2px 6px rgba(125,95,43,.2)}
.st b{font-weight:400;font-size:calc(var(--fu) * .044);color:var(--ink)}

/* RSVP on WhatsApp */
.rsvptx{font-size:calc(var(--fu) * .037);color:var(--ink-2);line-height:1.5;margin-top:4px!important}
.wa{display:grid;gap:10px;justify-items:center;margin-top:14px}
.wa .btn{font-size:calc(var(--fu) * .04);padding:7px 20px;letter-spacing:.03em}

@media (prefers-reduced-motion: reduce){
  .sched::before{transition:none;transform:none}
  .rv{transition:none;opacity:1;transform:none;filter:none}
  .bow,.tap,#cue svg{animation:none}
}
</style>
</head>
<body class="locked">
<div id="stage">
  <div class="fr bg" aria-hidden="true"><i class="t"></i><i class="m"></i><i class="b"></i></div>
  <!-- the whole card is drawn by the script, in English or Arabic -->
  <main id="scroll" class="intro"></main>

      rv("span", "credit", "THE INVITARY", .95) +
      '<img class="couple rv" src="' + esc(C.coupleImage || "assets/couple.webp") + '" alt="" style="--d:.3s"></section>';

    scroller.innerHTML = h;
    tick(); fitNames();
  }

  // gate and floating button labels
  function chrome() {
    var html = document.documentElement;
    html.lang = LANG; html.dir = LANG === "ar" ? "rtl" : "ltr";
    $("#tapTxt").textContent = U("tap"); $("#cueTxt").textContent = U("scroll"); $("#gforLbl").textContent = U("for");
    $("#gate").setAttribute("aria-label", LANG === "ar" ? "افتح الدعوة" : "Open the invitation");
    mBtn.setAttribute("aria-label", LANG === "ar" ? (muted ? "تشغيل الموسيقى" : "إيقاف الموسيقى") : (muted ? "Play music" : "Mute music"));
  }

  function fitNames() {
    $$(".names .nm").forEach(function (el) {
      el.style.fontSize = ""; var box = el.parentNode.clientWidth, fs = parseFloat(getComputedStyle(el).fontSize);   // stay inside the frame: "Syed M Haris" is long
      while (el.scrollWidth > box && fs > 20) { fs -= 1; el.style.fontSize = fs + "px"; }
    });
    // long occasion titles: shrink until every word fits the width
    $$(".evt, .h2").forEach(function (el) {
      el.style.fontSize = ""; var fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 1 && fs > 18) { fs -= 1; el.style.fontSize = fs + "px"; }
    });
  }

  /* ---------- countdown ---------- */
  function tick() {
    var ms = Math.max(0, main.date - Date.now()), d = Math.floor(ms / 864e5); ms -= d * 864e5;
    var hh = Math.floor(ms / 36e5); ms -= hh * 36e5; var m = Math.floor(ms / 6e4), s = Math.floor((ms - m * 6e4) / 1e3);
    [["d", d], ["h", hh], ["m", m], ["s", s]].forEach(function (x) { var el = document.querySelector('#clock [data-u="' + x[0] + '"]'); if (el) el.textContent = num(x[1]); });
  }
  setInterval(tick, 1000);

  /* ---------- reveal on scroll ---------- */
  var io = new IntersectionObserver(function (ents) {
    ents.forEach(function (en) { if (en.isIntersecting && document.body.classList.contains("opened")) en.target.classList.add("on"); });
  }, { root: scroller, threshold: .3 });
  function observe() { $$(".sec").forEach(function (s) { io.observe(s); }); }
  var cue = $("#cue");
  scroller.addEventListener("scroll", function () { if (scroller.scrollTop > 40) cue.classList.remove("show"); }, { passive: true });

  /* ---------- tap anywhere: a blessing in gold with sparkles ---------- */
  var cv = $("#sparks"), cx = cv.getContext("2d"), parts = [], running = false;
  function size() { var d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener("resize", size);
  function burst(x, y, n) {
    if (RM) return;
    var cols = ["#e2c487", "#c9a463", "#fffaf0", "#f3d9d2", "#a8823f"];
    for (var i = 0; i < n; i++) { var a = Math.random() * Math.PI * 2, v = 1.2 + Math.random() * 3.6; parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.6, r: Math.random() * Math.PI, s: 2 + Math.random() * 3, c: cols[i % cols.length], life: 1, pearl: Math.random() < .45 }); }
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  function loop() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.life > 0; });
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.r += .08; p.life -= .011;
      cx.save(); cx.globalAlpha = Math.max(0, p.life); cx.translate(p.x, p.y); cx.rotate(p.r);
      if (p.pearl) { var g = cx.createRadialGradient(-p.s * .3, -p.s * .3, 0, 0, 0, p.s); g.addColorStop(0, "#fff"); g.addColorStop(1, "#e6dccb"); cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, p.s, 0, Math.PI * 2); cx.fill(); }
      else { cx.fillStyle = p.c; cx.beginPath(); for (var k = 0; k < 8; k++) { var rr = k % 2 ? p.s * .4 : p.s * 1.4, an = k * Math.PI / 4; cx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } cx.fill(); }
      cx.restore();
    });
    if (parts.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  var opened = false, lastWord = -1;
  function blessAt(x, y, word) {
    var words = T(C.blessings) || []; if (!Array.isArray(words)) words = [words];
    if (!word) { if (!words.length) return; var k; do { k = (Math.random() * words.length) | 0; } while (words.length > 1 && k === lastWord); lastWord = k; word = words[k]; }
    var el = document.createElement("div"); el.className = "bless"; el.textContent = word;
    el.style.left = Math.min(Math.max(x, 110), innerWidth - 110) + "px"; el.style.top = Math.max(y, 90) + "px";
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2000);
    burst(x, y, 24);
  }
  document.addEventListener("click", function (e) {
    if (!opened || !e.target.closest) return;
    if (e.target.closest("a,button,input,textarea,select,label,form,.previewbar,#gate")) return;
    blessAt(e.clientX, e.clientY);
  });

  /* ---------- music: starts softly as the gate opens ---------- */
  var VOL = .5, aud = null, actx = null, gain = null, muted = false, mBtn = $("#music");
  function startMusic() {
    if (!C.music || aud) return;
    aud = new Audio(C.music); aud.loop = true; aud.preload = "auto";
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { actx = new AC(); var src = actx.createMediaElementSource(aud); gain = actx.createGain(); src.connect(gain); gain.connect(actx.destination);
      var t = actx.currentTime; gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(VOL, t + 4); } catch (e) { actx = null; } }
    if (!actx) { var v = 0; aud.volume = 0; var iv = setInterval(function () { v = Math.min(VOL, v + .025); aud.volume = v; if (v >= VOL) clearInterval(iv); }, 200); }
    aud.play().catch(function () {}); mBtn.hidden = false;
  }
  mBtn.addEventListener("click", function () {
    muted = !muted; mBtn.classList.toggle("muted", muted); chrome();
    if (!aud) return; if (muted) aud.pause(); else { if (actx && actx.state === "suspended") actx.resume(); aud.play().catch(function () {}); }
  });
  document.addEventListener("visibilitychange", function () { if (!aud || muted) return; if (document.hidden) aud.pause(); else { if (actx && actx.state === "suspended") actx.resume(); aud.play().catch(function () {}); } });

  /* ---------- first draw ---------- */
  if (C.guest && C.guest.name) { $("#gfor").hidden = false; $("#gname").textContent = C.guest.name; }
  if (C.preview) { document.body.classList.add("is-preview"); $("#previewbar").hidden = false; if (C.buyUrl) $("#buyLink").href = C.buyUrl; else $("#buyLink").hidden = true; }
  chrome(); build(); observe();
  addEventListener("resize", fitNames); if (document.fonts) document.fonts.ready.then(fitNames);

  /* ---------- opening: the bow lifts away, light breaks through the seam, the gate parts ---------- */
  var gate = $("#gate");
  function reveal() {
    document.body.classList.remove("locked"); document.body.classList.add("opened"); opened = true;
    scroller.classList.add("in"); var hero = $("#s-hero"); if (hero) hero.classList.add("on");
    fitNames();
    setTimeout(function () { if (scroller.scrollTop < 40) cue.classList.add("show"); }, 2600);
  }
  function openGate() {
    if (gate.classList.contains("open")) return;
    startMusic();
    if (RM) { gate.classList.add("gone"); reveal(); return; }
    gate.classList.add("open");
    setTimeout(function () { gate.classList.add("part"); }, 950);
    setTimeout(function () { $("#haze").classList.add("go"); }, 1300);
    setTimeout(reveal, 1700);
    setTimeout(function () { gate.classList.add("gone"); burst(innerWidth / 2, innerHeight * .4, 40); }, 3400);
  }
  gate.addEventListener("click", openGate);
  // Safari and in-app browsers can restore an old copy of the page when a guest comes back to it; load it fresh instead
  addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
  gate.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGate(); } });
})();
</script>
